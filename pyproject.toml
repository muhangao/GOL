[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gol-warmup"
version = "0.1.0"
description = "Loss-first experiments for Game of Life warmup and subsequent language learning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.4,<3"]

[project.optional-dependencies]
tokenize = ["tokenizers>=0.21,<0.23", "huggingface-hub>=0.24,<2"]
plot = ["matplotlib>=3.8,<4"]
test = ["pytest>=8,<10"]

[project.scripts]
gol-prepare = "gol.data:main"
gol-train = "gol.train:main"
gol-plot = "gol.plot:main"

[tool.setuptools.packages.find]
include = ["gol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
